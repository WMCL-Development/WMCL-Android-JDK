name: Build JDK 21

on:
  push:
    branches: [ openjdk-jdk21 ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target_arch: arm64
          - arch: x86_64
            target_arch: x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf python3 python-is-python3 unzip zip xz-utils wget \
            systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev \
            libxrender-dev libxt-dev

      - name: Build JDK 21
        run: bash scripts/build-android-jre.sh

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdk21-android-${{ matrix.arch }}
          path: out/jdk21-android-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
