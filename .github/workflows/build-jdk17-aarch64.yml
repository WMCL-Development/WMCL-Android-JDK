name: Build JDK 17 aarch64

on:
  push:
    branches: [ openjdk-jdk17 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf python3 python-is-python3 unzip zip xz-utils wget \
            systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev \
            libxrender-dev libxt-dev

      - name: Build JDK 17 aarch64
        run: bash scripts/build-jdk17-aarch64.sh

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdk17-android-arm64
          path: out/jdk17-android-arm64.tar.xz
          if-no-files-found: error
