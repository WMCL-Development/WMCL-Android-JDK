name: Build JDK 11 aarch64

on:
  push:
    branches: [ jdk11 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf python3 python-is-python3 unzip zip xz-utils wget \
            systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev \
            libxrender-dev libxt-dev

      - name: Build JDK 11 aarch64 JRE
        run: bash scripts/build-android-jre.sh

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre11-android-arm64
          path: out/jre11-android-arm64.tar.xz
          if-no-files-found: error
